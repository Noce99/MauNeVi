[package]
name = "maunevi"
version = "0.1.0"
edition = "2021"
description = "MauNeVi: MAUro NEtworks VIsualizer -- serves the architecture descriptors `mauro net describe` writes, and a viewer for them"
license = "GPL-3.0-or-later"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

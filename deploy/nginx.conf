# nginx in front of MauNeVi, at https://example.org/maunevi/. The trailing
# slashes strip the prefix, so MauNeVi needs no MAUNEVI_BASE_PATH; its page
# only uses relative URLs.
location = /maunevi { return 301 /maunevi/; }
location /maunevi/ {
    proxy_pass http://127.0.0.1:8765/;
    proxy_set_header Host $host;
}
